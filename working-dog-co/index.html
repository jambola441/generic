<style>
:root{--bg:#efede7;--paper:#faf9f5;--fg:#1d201d;--muted:#5f655e;--line:#d3cfc4;--accent:#2d6b3f;--accent-ink:#fff;--bad:#a63c2f;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#141615;--paper:#1c1f1d;--fg:#ebe9e2;--muted:#a3a89f;--line:#343935;--accent:#7cc287;--accent-ink:#0f1a11;--bad:#e07b6c}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Public Sans",system-ui,sans-serif;display:grid;place-items:center;padding:24px}
.card{background:var(--paper);border:1px solid var(--line);padding:28px 26px;width:min(100%,420px);display:grid;gap:14px}
h1{font:700 30px/1 "Barlow Condensed","Arial Narrow",sans-serif;text-transform:uppercase;margin:0;letter-spacing:.01em}
p{margin:0;color:var(--muted);font-size:14px}
label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:600 13px "Public Sans",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;padding:12px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.ghost{background:none;border:1px solid var(--line);color:var(--fg)}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13px;min-height:1.2em}
.ok{color:var(--accent);font-size:14px}
b{font-weight:600}
</style>
</head>

const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const $ = id => document.getElementById(id);
const store = { get() { try { return JSON.parse(localStorage.getItem('wdc-auth') || 'null'); } catch (_) { return null; } }, set(s) { try { localStorage.setItem('wdc-auth', JSON.stringify(s)); } catch (_) {} }, clear() { try { localStorage.removeItem('wdc-auth'); } catch (_) {} } };
const emailOf = jwt => { try { return JSON.parse(atob(jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).email || ''; } catch (_) { return ''; } };
const here = () => location.origin + location.pathname;
async function gotrue(path, body) {
  const r = await fetch(SUPA.url + '/auth/v1/' + path, { method: 'POST', headers: { apikey: SUPA.key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({})); if (!r.ok) { const e = new Error(j.msg || j.error_description || j.message || ('HTTP ' + r.status)); e.status = r.status; throw e; } return j;
}
function fromHash() {
  const h = location.hash.slice(1); if (!h) return null; const q = new URLSearchParams(h);
  if (q.get('error')) { history.replaceState(null, '', here()); throw new Error(q.get('error_description') || q.get('error')); }
  if (!q.get('access_token')) return null;
  const s = { access_token: q.get('access_token'), refresh_token: q.get('refresh_token'), expires_at: Date.now() + Number(q.get('expires_in') || 3600) * 1000 };
  s.email = emailOf(s.access_token); history.replaceState(null, '', here()); return s;
}
async function session() {
  let s = fromHash(); if (s) store.set(s); else s = store.get(); if (!s) return null;
  if (s.expires_at - Date.now() < 90000) {
    try { const j = await gotrue('token?grant_type=refresh_token', { refresh_token: s.refresh_token }); s = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, email: (j.user && j.user.email) || emailOf(j.access_token) }; store.set(s); }
    catch (_) { store.clear(); return null; }
  }
  return s;
}
async function siteKey(s) {
  const r = await fetch(SUPA.url + '/rest/v1/rpc/wdc_site_key', { method: 'POST', headers: { apikey: SUPA.key, Authorization: 'Bearer ' + s.access_token, 'Content-Type': 'application/json' }, body: '{}' });
  if (r.status === 401) { store.clear(); const e = new Error('expired'); e.code = 'expired'; throw e; }
  if (!r.ok) { const e = new Error('not allowed'); e.code = 'denied'; throw e; }
  return JSON.parse(await r.text());
}
async function open(hex) {
  const raw = Uint8Array.from(hex.match(/../g), h => parseInt(h, 16));
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(P.iv) }, key, u8(P.ct));
  document.open(); document.write(new TextDecoder().decode(pt)); document.close();
}
function denied(email) {
  $('lead').innerHTML = '<b>' + email.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])) + '</b> is not on the list for this plan. Ask the person who shared it to add you, then reload.';
  $('field').hidden = true; $('go').hidden = true; $('back').hidden = false; $('f').style.visibility = '';
}
// Runs after parsing: document.open() is a no-op while the parser is active.
const boot = async () => {
  let s = null;
  try { s = await session(); } catch (e) { $('err').textContent = e.message; return; }
  if (!s) { $('f').style.visibility = ''; return; }
  $('f').style.visibility = 'hidden';
  try { await open(await siteKey(s)); }
  catch (e) { if (e.code === 'denied') denied(s.email); else { $('f').style.visibility = ''; $('err').textContent = e.code === 'expired' ? 'Your sign-in expired. Request a new link.' : 'Could not open the plan: ' + e.message; } }
};
$('f').style.visibility = 'hidden';
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(boot, 0)); else setTimeout(boot, 0);
$('back').addEventListener('click', () => { store.clear(); location.href = here(); });
$('f').addEventListener('submit', async e => {
  e.preventDefault(); const btn = $('go'), err = $('err'), email = $('em').value.trim().toLowerCase();
  btn.disabled = true; err.textContent = '';
  try {
    await gotrue('otp?redirect_to=' + encodeURIComponent(here()), { email, create_user: true });
    $('lead').innerHTML = 'Check <b>' + email.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])) + '</b> for a message from Supabase Auth and click the link. It opens the plan in this browser and lasts a long while; the link itself expires in an hour.';
    $('field').hidden = true; btn.hidden = true; $('back').hidden = false;
  } catch (ex) {
    err.textContent = ex.status === 429 ? 'Too many sign-in emails were requested in the last hour. Try again later.' : 'Could not send the link: ' + ex.message;
    btn.disabled = false;
  }
});
})();
