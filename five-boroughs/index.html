<title>Five Boroughs · private</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Public+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#efede7;--paper:#faf9f5;--fg:#1d201d;--muted:#5f655e;--line:#d3cfc4;--accent:#2d6b3f;--accent-ink:#fff;--bad:#a63c2f;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#141615;--paper:#1c1f1d;--fg:#ebe9e2;--muted:#a3a89f;--line:#343935;--accent:#7cc287;--accent-ink:#0f1a11;--bad:#e07b6c}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Public Sans",system-ui,sans-serif;display:grid;place-items:center;padding:24px}
form{background:var(--paper);border:1px solid var(--line);padding:28px 26px;width:min(100%,400px);display:grid;gap:14px}
h1{font:700 30px/1 "Barlow Condensed","Arial Narrow",sans-serif;text-transform:uppercase;margin:0;letter-spacing:.01em}
p{margin:0;color:var(--muted);font-size:14px}
label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:600 13px "Public Sans",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;padding:12px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13px;min-height:1.2em}
</style>
</head>

  <label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:13px;color:var(--fg)"><input id="keep" type="checkbox" checked style="width:auto;margin:0">Keep me signed in on this device</label>
  <button id="go" type="submit">Open the flyer</button>
  <div class="err" id="err" aria-live="polite"></div>
</form>

async function openPlan(key) {

  document.open(); document.write(html); document.close();

async function keyFrom(pw) {
